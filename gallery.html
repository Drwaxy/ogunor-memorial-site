<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Gallery &middot; Late Pa. Hyacinth Nwafor Ogunor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body data-page="gallery">

<a class="skip-link" href="#main-content">Skip to main content</a>

<div data-include="partials/nav.html"></div>

<main id="main-content">
  <section style="padding-bottom:40px;">
    <div class="container section-head">
      <p class="eyebrow">In Pictures</p>
      <h1>Photo Gallery</h1>
      <div class="divider">
        <svg class="icon"><use href="assets/icons/sprite.svg#icon-image"></use></svg>
      </div>
      <p>A journey through the decades &mdash; from his wedding day to family celebrations with his children and grandchildren. Click any photo to view it larger.</p>
    </div>

    <div class="container gallery-grid" id="galleryGrid">

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: A Young Man" data-caption="A young Pa Hyacinth in a 1970s studio portrait, taken not long before the Nigerian Civil War years and his life of trade and travel across the North.">
        <img src="assets/photos/gallery-15.jpg" alt="A young Pa. Ogunor in a 1970s studio portrait with an afro and sparkling backdrop" loading="lazy" decoding="async">
        <span class="caption-bar">A Young Man</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: His Wedding Day" data-caption="Pa Hyacinth and his bride, Ogechukwu, seated together on their wedding day, 17 December 1974 &mdash; the beginning of a marriage that would last nearly 39 years.">
        <img src="assets/photos/gallery-1.jpg" alt="Pa. Ogunor and his bride on their wedding day, seated together" loading="lazy" decoding="async">
        <span class="caption-bar">His Wedding Day</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: Signing the Register" data-caption="Family and friends gather around as the young couple sign the wedding register, marking the formal start of their life together.">
        <img src="assets/photos/gallery-2.jpg" alt="Signing the wedding register surrounded by family and friends" loading="lazy" decoding="async">
        <span class="caption-bar">Signing the Register</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: The Wedding Party" data-caption="Pa Hyacinth, his bride, and their full wedding party pose together after the ceremony, surrounded by well-wishers.">
        <img src="assets/photos/gallery-3.jpg" alt="Pa. Ogunor with his bride and the full wedding party" loading="lazy" decoding="async">
        <span class="caption-bar">The Wedding Party</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: Reception Speech" data-caption="Pa Hyacinth addresses guests at the wedding reception, family gathered around the table behind him.">
        <img src="assets/photos/gallery-4.jpg" alt="Pa. Ogunor giving a speech at his wedding reception" loading="lazy" decoding="async">
        <span class="caption-bar">Reception Speech</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: In His Prime" data-caption="Pa Hyacinth beside a car during his years of trade and travel across Northern Nigeria, before he joined Siemens on the national electrification project.">
        <img src="assets/photos/gallery-5.jpg" alt="Pa. Ogunor standing beside a car in his middle years" loading="lazy" decoding="async">
        <span class="caption-bar">In His Prime</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: A Quiet Portrait" data-caption="A quiet studio portrait of Pa Hyacinth in one of his favourite ankara shirts.">
        <img src="assets/photos/gallery-6.jpg" alt="Portrait of Pa. Ogunor in a yellow and blue ankara shirt" loading="lazy" decoding="async">
        <span class="caption-bar">A Quiet Portrait</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: Dad, Chilling" data-caption="Pa Hyacinth relaxing at home in Enuagu Village in his later years, cane in hand.">
        <img src="assets/photos/gallery-7.jpg" alt="Pa. Ogunor relaxing at home in traditional attire" loading="lazy" decoding="async">
        <span class="caption-bar">Dad, Chilling</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: With His Cousin" data-caption="Pa Hyacinth sharing a lighthearted moment at home with a beloved cousin.">
        <img src="assets/photos/gallery-8.jpg" alt="Pa. Ogunor with his cousin, both smiling" loading="lazy" decoding="async">
        <span class="caption-bar">With His Cousin</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: At Ebuka's Wedding" data-caption="Pa Hyacinth with family at the church entrance for the wedding of his son Ebuka &mdash; one of the many family celebrations he never missed.">
        <img src="assets/photos/gallery-9.jpg" alt="Pa. Ogunor with family at the church entrance at Ebuka's wedding" loading="lazy" decoding="async">
        <span class="caption-bar">At Ebuka&rsquo;s Wedding</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: At Emeka's Wedding" data-caption="Pa Hyacinth with family at the wedding of his son Emeka, seated proudly among the wedding party.">
        <img src="assets/photos/gallery-10.jpg" alt="Pa. Ogunor with family at Emeka's wedding" loading="lazy" decoding="async">
        <span class="caption-bar">At Emeka&rsquo;s Wedding</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: Surrounded by His Daughters and Daughters-in-Law" data-caption="Pa Hyacinth surrounded by his daughters, sons, and daughters-in-law at Ozonweluibe's wedding &mdash; a rare photograph with so much of his family gathered together.">
        <img src="assets/photos/gallery-12.jpg" alt="Pa. Ogunor with his daughters, sons and daughters-in-law at a family wedding" loading="lazy" decoding="async">
        <span class="caption-bar">His Daughters &amp; Daughters-in-Law</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: The Whole Family, Together" data-caption="Pa Hyacinth with the extended Ogunor family at the wedding of his last son, Stephen Okwuchukwu Oguno (Ozonweluibe) &mdash; children, grandchildren, in-laws and relatives all gathered together.">
        <img src="assets/photos/gallery-13.jpg" alt="Pa. Ogunor with the extended Ogunor family at the wedding of his last son, Stephen Okwuchukwu Oguno" loading="lazy" decoding="async">
        <span class="caption-bar">The Whole Family, Together</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: A Newborn in His Arms" data-caption="Pa Hyacinth cradling one of his newborn grandchildren at home &mdash; a role he cherished, and one more addition to a family he loved gathering around him.">
        <img src="assets/photos/gallery-14.jpg" alt="Pa. Ogunor holding a sleeping newborn grandchild at home" loading="lazy" decoding="async">
        <span class="caption-bar">A Newborn in His Arms</span>
      </figure>

      <figure class="gallery-item" tabindex="0" role="button" aria-label="View photo: Jolly Good Dad" data-caption="The jolly, joyful man everyone remembers &mdash; Pa Hyacinth caught mid-laugh, glasses in hand.">
        <img src="assets/photos/gallery-11.jpg" alt="Pa. Ogunor smiling playfully, holding his glasses" loading="lazy" decoding="async">
        <span class="caption-bar">Jolly Good Dad</span>
      </figure>

    </div>

    <div class="container" style="text-align:center; margin-top:32px;">
      <p style="opacity:0.7; font-size:0.95rem;">Have a photo to add? Please share it directly with a member of the Ogunor family for inclusion.</p>
    </div>
  </section>
</main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <div class="lightbox-inner">
    <button id="lightboxClose" class="lightbox-close" aria-label="Close">
      <svg class="icon"><use href="assets/icons/sprite.svg#icon-close"></use></svg>
    </button>
    <img id="lightboxImg" src="" alt="" style="max-height:80vh; margin:0 auto; border:1px solid var(--gold);">
    <p id="lightboxCaption" style="color:var(--cream-2); margin-top:16px; font-family:var(--font-sub); letter-spacing:0.05em; max-width:640px; margin-left:auto; margin-right:auto; line-height:1.6;"></p>
  </div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/main.js"></script>
</body>
</html>
